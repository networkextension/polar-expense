# nginx snippet — routes /api/expense* (categories + ledger + image
# upload + image download) to expense-svc (:8097). Pair with
# POLAR_EXPENSE_REMOTE=true on the dock side once cutover lands.

location ~ ^/api/(expenses|expense-categories) {
    proxy_pass http://127.0.0.1:8097;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    # Receipt images can run up to 25 MiB (the in-plugin guard);
    # bump nginx so multipart uploads aren't rejected before they
    # reach the size check.
    client_max_body_size 30m;
    # OCR + multimodal LLM extraction can take 60-90s on long
    # screenshots; give the proxy enough headroom not to abort.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
